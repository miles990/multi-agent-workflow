# Quality Gates Configuration
# 6 階段完整品質閘門定義

version: "1.0"

# 閘門定義
gates:
  RESEARCH:
    description: "研究階段閘門"
    pass_criteria:
      mandatory:
        - id: "minimum_consensus"
          check: "至少 2 視角達成共識"
          validation: "count_consensus_points >= 2"

        - id: "no_critical_conflicts"
          check: "無未解決的關鍵矛盾"
          validation: "critical_conflicts == 0"

      recommended:
        - id: "all_perspectives_complete"
          check: "所有視角報告完成"

        - id: "synthesis_generated"
          check: "匯總報告已生成"

    quality_score_threshold: 70
    on_fail: "request_additional_research"

  PLAN:
    description: "計劃階段閘門"
    pass_criteria:
      mandatory:
        - id: "components_designed"
          check: "所有必要組件有設計"
          validation: "all_components_have_design"

        - id: "risk_assessment_complete"
          check: "風險評估完成"
          validation: "risk_assessment_exists"

        - id: "milestones_defined"
          check: "里程碑定義清晰"
          validation: "milestones_count >= 1"

      recommended:
        - id: "alternatives_considered"
          check: "替代方案有考慮"

        - id: "dependencies_mapped"
          check: "依賴關係已映射"

    quality_score_threshold: 75
    on_fail: "request_plan_revision"

  TASKS:
    description: "任務分解階段閘門"
    pass_criteria:
      mandatory:
        - id: "dag_valid"
          check: "DAG 驗證通過"
          validation: "run_dag_validator"

        - id: "tdd_complete"
          check: "TDD 對應完整"
          validation: "all_features_have_tests"

        - id: "estimates_present"
          check: "所有任務有估算"
          validation: "all_tasks_have_estimate"

      recommended:
        - id: "estimates_reasonable"
          check: "估算在合理範圍"
          validation: "estimates_in_range(10, 60)"

        - id: "files_specified"
          check: "files 欄位完整"

    quality_score_threshold: 80
    on_fail: "request_task_revision"

  IMPLEMENT:
    description: "實作階段閘門"
    pass_criteria:
      mandatory:
        - id: "all_tasks_complete"
          check: "所有任務完成"
          validation: "completed_tasks == total_tasks"

        - id: "tests_pass"
          check: "測試通過"
          validation: "test_pass_rate == 100"

        - id: "no_blockers"
          check: "無 BLOCKER 問題"
          validation: "blocker_count == 0"

      recommended:
        - id: "coverage_threshold"
          check: "測試覆蓋率達標"
          validation: "coverage >= 80"

        - id: "no_todos"
          check: "無 TODO 遺留"

    quality_score_threshold: 80
    on_fail: "trigger_fix_cycle"

  REVIEW:
    description: "審查階段閘門"
    pass_criteria:
      mandatory:
        - id: "no_blockers"
          check: "無 BLOCKER"
          validation: "blocker_count == 0"

        - id: "limited_high_issues"
          check: "HIGH 問題 <= 2"
          validation: "high_issue_count <= 2"

      recommended:
        - id: "all_issues_actionable"
          check: "所有問題有具體修復建議"

        - id: "security_review_pass"
          check: "安全審查通過"

    quality_score_threshold: 75
    on_fail: "trigger_review_fix_cycle"

  VERIFY:
    description: "驗證階段閘門"
    pass_criteria:
      mandatory:
        - id: "functional_tests_pass"
          check: "功能測試 100% 通過"
          validation: "functional_test_pass_rate == 100"

        - id: "regression_tests_pass"
          check: "回歸測試通過"
          validation: "regression_test_pass_rate == 100"

        - id: "acceptance_verified"
          check: "驗收標準滿足"
          validation: "acceptance_criteria_met"

      recommended:
        - id: "edge_cases_tested"
          check: "邊界案例測試"

        - id: "performance_baseline_met"
          check: "效能基準達標"

    quality_score_threshold: 85
    on_fail: "trigger_verify_fix_cycle"

  CT_LITE:
    description: "Constraint Texture Lite Gate"
    applies_when: "ct_mode == lite"
    pass_criteria:
      mandatory:
        - id: "evidence_uncertainty_marked"
          check: "核心 claim 已標記 evidence / uncertainty"
          validation: "evidence_uncertainty_marked == true"

        - id: "no_obvious_topic_drift"
          check: "無明顯 topic drift"
          validation: "drift_event_count <= 2"

      recommended:
        - id: "unsupported_claim_rate_low"
          check: "無證據 claim 比例 <= 20%"
          validation: "unsupported_claim_rate <= 0.2"

    quality_score_threshold: 70
    on_fail: "request_research_revision"

  CT_STRICT:
    description: "Constraint Texture Strict Gate"
    applies_when: "ct_mode == strict"
    pass_criteria:
      mandatory:
        - id: "ct_stack_exists"
          check: "CT stack 已生成"
          validation: "ct_stack_exists == true"

        - id: "ct_compliance_exists"
          check: "CT compliance report 已生成"
          validation: "ct_compliance_exists == true"

        - id: "no_high_ct_violation"
          check: "無 HIGH 等級 CT 違規"
          validation: "high_ct_violations == 0"

        - id: "evidence_coverage"
          check: "核心 claim 證據覆蓋率 >= 80%"
          validation: "evidence_coverage >= 0.8"

      recommended:
        - id: "low_drift_rate"
          check: "Agent drift rate <= 10%"
          validation: "drift_rate <= 0.1"

        - id: "output_contract_met"
          check: "輸出符合 CT output contract"
          validation: "output_contract_met == true"

    quality_score_threshold: 80
    on_fail: "request_ct_revision"

  CT_EXPERIMENT:
    description: "Constraint Texture Experiment Gate"
    applies_when: "ct_mode == experiment"
    pass_criteria:
      mandatory:
        - id: "hypotheses_exist"
          check: "研究假設已生成"
          validation: "hypotheses_exist == true"

        - id: "hypothesis_testability"
          check: "研究假設可測性 >= 70%"
          validation: "hypothesis_testability_score >= 0.7"

        - id: "experiment_plan_exists"
          check: "實驗計劃已生成"
          validation: "experiment_plan_exists == true"

        - id: "experiment_readiness"
          check: "實驗設計具備變因、對照組、評分標準"
          validation: "experiment_readiness_score >= 0.7"

      recommended:
        - id: "experiment_immediacy"
          check: "實驗設計可立即執行"
          validation: "experiment_readiness_score >= 0.7"

        - id: "failure_modes_mined"
          check: "失敗模式已挖掘"
          validation: "failure_modes_exist == true"

        - id: "harness_scored"
          check: "experiment harness 至少執行一次 scorer"
          validation: "experiment_harness_scored == true"

    quality_score_threshold: 85
    on_fail: "request_experiment_revision"

# 閘門行為配置
gate_behavior:
  on_mandatory_fail:
    action: "halt"
    notification: true
    log_level: "error"

  on_recommended_fail:
    action: "warn"
    notification: true
    log_level: "warning"

  on_score_below_threshold:
    action: "request_improvement"
    max_retries: 3

# 閘門報告
reporting:
  format: "markdown"
  include:
    - "gate_name"
    - "pass_status"
    - "criteria_results"
    - "quality_score"
    - "recommendations"
  output_path: ".claude/memory/gates/"
