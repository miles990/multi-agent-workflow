version: "1.0"
description: "Schema for compiled CT stacks and compliance reports"

ct_stack:
  topic:
    type: string
    required: true
  topic_id:
    type: string
    required: true
  mode:
    type: string
    enum: [research-grade, planning-grade, implementation-grade]
    default: research-grade
  objective:
    type: string
    required: true
  constraints:
    type: array
    items:
      id: string
      layer: string
      severity: low | medium | high | blocker
      rule: string
      validation: string
  output_contract:
    type: object
    required_sections:
      - claim
      - evidence
      - uncertainty
      - next_action

claim:
  id: string
  statement: string
  source_agent: string
  evidence:
    type: array
    items:
      type: primary | secondary | inference
      reference: string
      confidence: low | medium | high
  uncertainty: low | medium | high
  status: supported | hypothesis | rejected | needs_review

compliance_report:
  compliance_score:
    type: number
    range: [0, 100]
  drift_events:
    type: integer
    min: 0
  unsupported_claims:
    type: integer
    min: 0
  high_ct_violations:
    type: integer
    min: 0
  evidence_coverage:
    type: number
    range: [0, 1]
  hypothesis_testability_score:
    type: number
    range: [0, 1]
  experiment_readiness_score:
    type: number
    range: [0, 1]
