automation_levels:
  L1:
    name: record_only
    allowed:
      - "write ct-retrospective.md"
      - "write failure-modes.md"
    requires_tests: false
    requires_human_approval: false

  L2:
    name: proposal_only
    allowed:
      - "write self-upgrade-proposal.md"
      - "link evidence from logs and gates"
    requires_tests: false
    requires_human_approval: false

  L3:
    name: low_risk_docs_rules
    allowed:
      - "update markdown guidance"
      - "update CT templates"
      - "add regression prompt examples"
      - "adjust non-runtime scoring notes"
    requires_tests: true
    requires_human_approval: false

  L4a:
    name: runtime_rules
    allowed:
      - "update escalation rules"
      - "update non-critical validators"
      - "update non-critical runtime examples"
    requires_tests: true
    requires_human_approval: false
    guardrails:
      - "must include before/after failure evidence"
      - "must run relevant smoke test"
      - "must not change gate thresholds or halt behavior"

  L4b:
    name: quality_gate_changes
    allowed:
      - "propose quality gate changes"
      - "propose CT gate threshold changes"
      - "propose blocker handling changes"
    requires_tests: true
    requires_human_approval: true
    guardrails:
      - "must include before/after failure evidence"
      - "must include false-positive or false-negative analysis"
      - "must include rollback plan"

  L4c:
    name: workflow_script_changes
    allowed:
      - "propose workflow script changes"
      - "propose hook behavior changes"
      - "propose validation tool behavior changes"
    requires_tests: true
    requires_human_approval: true
    guardrails:
      - "must include focused smoke test"
      - "must include rollback plan"
      - "must not bypass mandatory checkpoints"

  L5:
    name: architecture_change
    allowed:
      - "change phase boundaries"
      - "change memory model"
      - "change install/distribution model"
      - "lower quality gate thresholds"
      - "remove mandatory gate criteria"
      - "weaken blocker handling"
    requires_tests: true
    requires_human_approval: true

hard_stops:
  - "Any patch that lowers a threshold, removes a mandatory criterion, changes halt behavior, or weakens blocker handling must be L5 and require human approval."
  - "Any patch that changes workflow scripts or quality gates may be proposed at L4b/L4c but must not be applied autonomously."

proposal_required_fields:
  - problem
  - evidence
  - proposed_change
  - target_files
  - risk_level
  - automation_level
  - verification_plan
  - rollback_plan
